<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e9e9e9">
<meta name="robots" content="index,follow">
<title>Side-B 论坛</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="sideb-start-error" style="display:none;border:1px solid #999;padding:10px;margin:8px;font:14px Arial,'SimSun',sans-serif;background:#fff"></div>
<div id="app"></div>
<script>
window.__sideBLoaded=false;
window.addEventListener("error",function(e){
  var box=document.getElementById("sideb-start-error");
  if(box){
    box.style.display="block";
    box.textContent="页面脚本没有正常启动。错误："+(e.message||"unknown");
  }
});
setTimeout(function(){
  if(!window.__sideBLoaded){
    var app=document.getElementById("app");
    var box=document.getElementById("sideb-start-error");
    if(app&&!app.innerHTML.trim()&&box){
      box.style.display="block";
      box.textContent="页面没有正常启动。请刷新页面后重试。";
    }
  }
},1800);
</script>
<script src="./app.js"></script>
<script>window.__sideBLoaded=true;</script>
</body>
</html>
