<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e9e9e9">
<title>Side-B 论坛</title>
</head>
<body>
<div id="sideb-start-error" style="display:none;border:1px solid #999;padding:10px;margin:8px;font:14px Arial,'SimSun',sans-serif;background:#fff"></div>
<div id="app"></div>
<script>
(function(){
  var FALLBACK_BUILD="rc1.8-20260830";
  function showError(msg){
    var b=document.getElementById("sideb-start-error");
    if(b){b.style.display="block";b.textContent=msg;}
  }
  function addCss(file,build){
    var l=document.createElement("link");
    l.rel="stylesheet";
    l.href="./"+file+"?v="+encodeURIComponent(build);
    document.head.appendChild(l);
  }
  function addJs(file,build){
    var s=document.createElement("script");
    s.src="./"+file+"?v="+encodeURIComponent(build);
    s.onload=function(){
      try{localStorage.setItem("sideb_last_loaded_build",build);}catch(e){}
    };
    s.onerror=function(){showError("页面脚本没有正常载入。请刷新页面后重试。");};
    document.body.appendChild(s);
  }
  function boot(v){
    v=v||{};
    var build=v.build||FALLBACK_BUILD;
    addCss(v.css||"styles.css",build);
    addJs(v.app||"app.js",build);
  }
  fetch("./version.json?_="+Date.now(),{cache:"no-store"})
    .then(function(r){if(!r.ok)throw new Error("version");return r.json();})
    .then(boot)
    .catch(function(){boot({build:FALLBACK_BUILD,app:"app.js",css:"styles.css"});});
})();
</script>
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("./sw.js?v=rc1.8-20260830",{updateViaCache:"none"}).catch(function(){});
  });
}
</script>
<noscript>请启用 JavaScript。</noscript>
</body>
</html>
